services:
  - type: web
    name: warehouse-intelligence-twin-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:3000,https://warehouse-intelligence-twin.pages.dev
